<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <h2>🔐 SOCKS5 代理</h2>

    <div class="status" id="status">
      <span class="status-dot" id="statusDot"></span>
      <span id="statusText">此标签页未启用代理</span>
    </div>

    <div class="form-group">
      <label for="proxySelect">代理服务器</label>
      <select id="proxySelect"></select>
      <small id="proxyHint">选择一个代理服务器</small>
    </div>

    <div class="form-group">
      <label for="bypassList">绕过规则（可选）</label>
      <textarea id="bypassList" rows="3"
        placeholder="localhost&#10;127.0.0.1&#10;*.local"></textarea>
      <small>每行一条，仅作用于本标签页</small>
    </div>

    <div class="btn-group">
      <button id="btnEnable" class="btn btn-primary">为此标签页启用代理</button>
    </div>
    <div class="btn-group">
      <button id="btnDisable" class="btn btn-secondary">取消此标签页的代理</button>
    </div>

    <div class="error-msg" id="errorMsg"></div>

    <div class="footer">
      <a href="#" id="openOptions">⚙ 管理代理服务器</a>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
