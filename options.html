<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>代理服务器管理 — SOCKS5 Proxy</title>
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <div class="page">
    <header class="page-header">
      <h1>⚙ 代理服务器管理</h1>
      <p class="subtitle">配置多个 SOCKS5 代理服务器，在插件弹窗中快速切换</p>
    </header>

    <!-- 添加 / 编辑表单 -->
    <section class="card">
      <h2 id="formTitle">添加代理服务器</h2>
      <form id="proxyForm" autocomplete="off">
        <input type="hidden" id="editId">

        <div class="field">
          <label for="name">名称 <span class="required">*</span></label>
          <input
            type="text"
            id="name"
            placeholder="例如：香港节点"
            maxlength="30"
            required
          >
          <small>用于在弹窗中辨识，随便起个名字</small>
        </div>

        <div class="field-row">
          <div class="field field-grow">
            <label for="host">地址（IP 或域名） <span class="required">*</span></label>
            <input
              type="text"
              id="host"
              placeholder="127.0.0.1"
              required
            >
          </div>
          <div class="field field-port">
            <label for="port">端口 <span class="required">*</span></label>
            <input
              type="number"
              id="port"
              placeholder="1080"
              min="1"
              max="65535"
              required
            >
          </div>
        </div>

        <div class="btn-row">
          <button type="submit" class="btn btn-primary" id="btnSave">添加</button>
          <button type="button" class="btn btn-secondary hidden" id="btnCancel">取消编辑</button>
        </div>

        <div class="form-error" id="formError"></div>
      </form>
    </section>

    <!-- 列表 -->
    <section class="card">
      <div class="card-header">
        <h2>已保存的代理服务器</h2>
        <span class="badge" id="countBadge">0</span>
      </div>
      <div id="proxyList" class="proxy-list"></div>
    </section>

    <div class="toast" id="toast"></div>
  </div>

  <script src="options.js"></script>
</body>
</html>
